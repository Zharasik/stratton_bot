{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block head %}
<style>
  .login-wrap {
    max-width: 360px;
    margin: 80px auto;
  }
  .login-wrap h1 { margin-bottom: 24px; font-size: 1.4rem; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 0.85rem; color: #64748b; margin-bottom: 6px; }
  .form-group input {
    width: 100%; padding: 9px 12px; border: 1px solid #cbd5e1;
    border-radius: 6px; font-size: 0.95rem;
  }
  .form-group input:focus { outline: 2px solid #2563eb; border-color: transparent; }
  .btn-primary { width: 100%; padding: 10px; }
</style>
{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card">
    <h1>Вход в NDA Admin</h1>
    <p id="tg-status" style="color:#64748b; font-size:.9rem; margin-bottom:16px; display:none">
      Выполняется вход через Telegram…
    </p>
    {% if password_enabled %}
    <form method="post">
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" autofocus required>
      </div>
      <button class="btn btn-primary" type="submit">Войти</button>
    </form>
    {% else %}
    <p style="color:#94a3b8; font-size:.9rem">Откройте приложение через кнопку в боте.</p>
    {% endif %}

    <script>
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg && tg.initData) {
        document.getElementById('tg-status').style.display = 'block';
      }
    </script>
  </div>
</div>
{% endblock %}
