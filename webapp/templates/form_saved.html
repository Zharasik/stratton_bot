{% extends "base.html" %}
{% block title %}Данные сохранены{% endblock %}
{% block content %}
<div style="text-align:center; padding: 80px 16px;">
  <div class="card" style="max-width:400px; margin:0 auto;">
    <p style="font-size:2rem; margin-bottom:16px;">✅</p>
    <h1 style="font-size:1.3rem; margin-bottom:12px;">Данные сохранены</h1>
    <p style="color:#64748b; font-size:0.9rem;">
      Оператор проверит информацию и сформирует NDA-документ.
    </p>
  </div>
</div>
<script>
  // Close the Telegram Mini App after 2 seconds
  setTimeout(function () {
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.close();
    }
  }, 2000);
</script>
{% endblock %}
